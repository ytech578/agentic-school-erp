# Keep the development stack stable when the repository directory is renamed
# or moved. Without an explicit project name, Compose derives ownership from
# the folder name and can orphan otherwise healthy database containers.
name: aischoolerpv10

services:
  postgres:
    image: postgres:16-alpine
    container_name: school_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: school_erp
      POSTGRES_PASSWORD: school_erp_dev_2026
      POSTGRES_DB: school_erp_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_erp -d school_erp_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:1.4.3
    container_name: school_erp_clamav
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  redis:
    image: redis:7-alpine
    container_name: school_erp_redis
    restart: unless-stopped
    command: redis-server --requirepass redis_dev_2026 --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  clamav_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
