# Same identity package for school-owned or approved cloud hosts. Compose 2.24.4+.
# Do not combine this with development.compose.yml or development bootstrap secrets.
services:
  server:
    ports: !override []
  identity-tls:
    image: nginx:alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
    restart: unless-stopped
    mem_limit: 128m
    depends_on: [server]
    environment:
      AUTHENTIK_DOMAIN: ${AUTHENTIK_DOMAIN:?Set the school-approved identity hostname}
      NGINX_ENVSUBST_FILTER: ^AUTHENTIK_DOMAIN$
    ports:
      # Explicit operator choice: never expose identity publicly by default.
      - "${AUTHENTIK_BIND_ADDRESS:?Set the approved private or public interface}:${AUTHENTIK_HTTPS_PORT:-443}:443"
    volumes:
      - ./production-nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${AUTHENTIK_TLS_DIRECTORY:?Provide trusted fullchain.pem and privkey.pem}:/identity-tls:ro
