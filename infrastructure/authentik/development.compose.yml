# Local protocol testing only. No machine-wide certificate trust is installed.
services:
  fixture-cache:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "127.0.0.1:6381:6379"
    command: [redis-server, --save, "", --appendonly, "no"]
  worker:
    environment:
      AUTHENTIK_BOOTSTRAP_PASSWORD_HASH: ${AUTHENTIK_BOOTSTRAP_PASSWORD_HASH:?Run development initialization}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:?Run development initialization}
  identity-tls:
    image: nginx:alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
    restart: unless-stopped
    mem_limit: 64m
    depends_on: [server]
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - ./development-nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../backups/identity/tls:/identity-tls:ro
