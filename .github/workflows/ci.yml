name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/erp_test?schema=public"
      JWT_SECRET: "ci-pipeline-test-jwt-secret-minimum-32-chars-long"
      JWT_REFRESH_SECRET: "ci-pipeline-test-refresh-jwt-secret-minimum-32-chars"
      REDIS_URL: "redis://localhost:6379"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api

      - name: Build Shared Package
        run: npm run build --workspace=packages/shared

      - name: Run Tests
        run: npm run test --workspaces --if-present

      - name: Build Applications
        run: npm run build --workspaces
