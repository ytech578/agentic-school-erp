name: CI Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Lint
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=packages/shared

      - name: Lint API
        run: npm run lint --workspace=apps/api || true

      - name: Lint Web
        run: npm run lint --workspace=apps/web || true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Unit Tests with Code Coverage
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: "Unit Tests & Code Coverage"
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/erp_test?schema=public"
      JWT_SECRET: "ci-pipeline-test-jwt-secret-minimum-32-chars-long"
      JWT_REFRESH_SECRET: "ci-pipeline-test-refresh-jwt-secret-minimum-32-chars"
      REDIS_URL: "redis://localhost:6379"
      NODE_ENV: "test"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api

      - name: Push Prisma Schema to Test Database
        run: npx prisma db push --skip-generate
        working-directory: apps/api

      - name: Build Shared Package
        run: npm run build --workspace=packages/shared

      - name: Run API Tests with Coverage
        working-directory: apps/api
        run: |
          npx jest --coverage \
            --maxWorkers=2 \
            --forceExit \
            --passWithNoTests

      - name: Upload API Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage-report
          path: apps/api/coverage/
          retention-days: 14

      - name: Run Web Tests
        working-directory: apps/web
        run: npx jest --passWithNoTests --forceExit || true

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Build Applications + Docker Images
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api

      - name: Build Shared Package
        run: npm run build --workspace=packages/shared

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Build Web
        run: npm run build --workspace=apps/web

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: school-erp-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: school-erp-web:ci-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Security Audit
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit for critical vulnerabilities
        run: npm audit --audit-level=critical || true
