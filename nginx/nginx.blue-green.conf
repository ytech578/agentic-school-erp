# ─────────────────────────────────────────────────────────────────────────────
# Nginx Blue/Green Deployment Configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# USAGE:
#   1. Both "blue" and "green" stacks run simultaneously in Docker Compose.
#   2. nginx.env controls which slot is LIVE:
#        ACTIVE_SLOT=blue   # or green
#   3. To deploy a new version:
#        a) Build & start the inactive slot (e.g. green).
#        b) Run health checks against the inactive slot directly.
#        c) Flip: echo 'ACTIVE_SLOT=green' > nginx.env && docker exec nginx nginx -s reload
#   4. To rollback instantly:
#        c) Flip back: echo 'ACTIVE_SLOT=blue' > nginx.env && docker exec nginx nginx -s reload
#
# ─────────────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 25M;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream="$upstream_addr" slot="$upstream_slot"';
    access_log /var/log/nginx/access.log main;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # ── Upstreams: Blue ───────────────────────────────────────────────────────
    upstream blue_web {
        server web_blue:3000;
        keepalive 32;
    }

    upstream blue_api {
        server api_blue:4000;
        keepalive 32;
    }

    # ── Upstreams: Green ──────────────────────────────────────────────────────
    upstream green_web {
        server web_green:3000;
        keepalive 32;
    }

    upstream green_api {
        server api_green:4000;
        keepalive 32;
    }

    # ── Map: active slot selection (controlled via nginx.env) ─────────────────
    # To switch: update ACTIVE_SLOT env var, then `nginx -s reload`
    geo $active_slot {
        default "blue";
    }

    map $active_slot $upstream_web {
        "blue"   blue_web;
        "green"  green_web;
        default  blue_web;
    }

    map $active_slot $upstream_api {
        "blue"   blue_api;
        "green"  green_api;
        default  blue_api;
    }

    # ── HTTP → HTTPS Redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS: Main Production Server ─────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate /etc/nginx/ssl/live/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Active-Slot $active_slot always;

        # API reverse proxy → active slot
        location /api/ {
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # ── CDN: Immutable Next.js static chunks ─────────────────────────────
        # These files have content hashes in their names — safe to cache forever
        location /_next/static/ {
            proxy_pass http://$upstream_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Immutable cache: 1 year, CDN and browser
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Vary "Accept-Encoding" always;
        }

        # ── CDN: Public static media (images, fonts, icons) ──────────────────
        location ~* \.(ico|png|jpg|jpeg|svg|webp|gif|woff2?|ttf|eot)$ {
            proxy_pass http://$upstream_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # 24h browser cache, 7-day CDN stale-while-revalidate
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
            add_header Vary "Accept-Encoding" always;
        }

        # Next.js frontend → active slot
        location / {
            proxy_pass http://$upstream_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }
    }

    # ── Direct access to Blue slot (for health checks & smoke tests) ──────────
    server {
        listen 8080;
        server_name _;

        location /api/ {
            proxy_pass http://blue_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://blue_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ── Direct access to Green slot (for health checks & smoke tests) ─────────
    server {
        listen 8081;
        server_name _;

        location /api/ {
            proxy_pass http://green_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://green_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
